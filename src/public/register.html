<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link href="css/style.css" rel="stylesheet" />
    <!-- Dark Mode CSS -->
    <link rel="stylesheet" href="css/darkMode.css" />
    <!-- <link href="css/color.css" rel="stylesheet" /> -->
    <!-- <link href="css/layout.css" rel="stylesheet" /> -->
  </head>
  <body class="light-mode">
    <header class="user-hero py-5 text-center">
      <div class="container">
        <h1 class="display-4 fw-bold">Take Control of Your Finances</h1>
        <p class="lead">Track spending, income, and financial activity in one place.</p>
      </div>
    </header>

    <main class="py-4">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <section class="card shadow-sm border-0 p-4 rounded-4">
              <h2 class="h4 mb-4 text-center fw-bold">Register</h2>

              <form id="signupForm">
                <div class="mb-3">
                  <label for="username" class="form-label fw-bold small text-uppercase"
                    >Username</label
                  >
                  <input
                    type="text"
                    class="form-control rounded-pill"
                    id="username"
                    placeholder="Enter username"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label fw-bold small text-uppercase">Email</label>
                  <input
                    type="email"
                    class="form-control rounded-pill"
                    id="email"
                    placeholder="Enter email"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label fw-bold small text-uppercase">
                    Password
                  </label>

                  <div class="input-group">
                    <input
                      type="password"
                      class="form-control rounded-start-pill"
                      id="password"
                      placeholder="Enter password"
                      required
                    />
                    <button
                      class="btn btn-outline-secondary rounded-end-pill"
                      type="button"
                      id="togglePassword"
                    >
                      <i class="bi bi-eye"></i>
                      <span>Show</span>
                    </button>
                  </div>
                </div>
                <div class="mb-4">
                  <label for="confirmPassword" class="form-label fw-bold small text-uppercase">
                    Confirm Password
                  </label>

                  <div class="input-group">
                    <input
                      type="password"
                      class="form-control rounded-start-pill"
                      id="confirmPassword"
                      placeholder="Re-enter password"
                      required
                    />
                    <button
                      class="btn btn-outline-secondary rounded-end-pill"
                      type="button"
                      id="toggleConfirmPassword"
                    >
                      <i class="bi bi-eye"></i>
                      <span>Show</span>
                    </button>
                  </div>
                </div>
                <div class="mb-4">
                  <label class="form-label fw-bold small text-uppercase">Captcha</label>

                  <div class="d-flex align-items-center gap-2">
                    <span id="captchaQuestion" class="fw-bold fs-5"></span>

                    <button
                      type="button"
                      class="btn btn-outline-secondary btn-sm"
                      id="refreshCaptcha"
                    >
                      ↻
                    </button>
                  </div>

                  <input
                    type="number"
                    class="form-control rounded-pill mt-2"
                    id="captchaInput"
                    placeholder="Enter your answer"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">
                  Begin Journey
                </button>
              </form>

              <div
                id="warningCard"
                class="alert alert-danger mt-3 d-none rounded-4 border-0"
                role="alert"
              >
                <p id="warningText" class="mb-0 small"></p>
              </div>

              <div class="mt-4 text-center">
                <p class="small text-muted">
                  Already a member?
                  <a
                    href="login.html"
                    class="text-decoration-none fw-bold"
                    style="color: var(--custom-color)"
                    >Login here</a
                  >
                </p>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"
      integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS"
      crossorigin="anonymous"
    ></script>
    <script defer src="js/queryCmds.js"></script>
    <script defer src="js/getCurrentURL.js"></script>
    <script defer src="js/refreshToken.js"></script>
    <script defer src="js/navbar.js"></script>
    <script defer src="js/userNavbarToggle.js"></script>
    <script defer src="js/registerUser.js" type="text/javascript"></script>
    <script defer src="js/footer.js" type="text/javascript"></script>
    <!-- Dark Mode Script -->
    <script defer src="js/darkMode.js"></script>
  </body>
</html>
