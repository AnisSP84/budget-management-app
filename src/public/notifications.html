<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Dark Mode CSS -->
    <link rel="stylesheet" href="css/darkMode.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          'Poppins',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-weight: 400;
        background: #f0f2f5;
        min-height: 100vh;
        padding: 0;
        transition: background-color 0.3s ease;
      }

      body.dark-mode {
        background: #1a1a2e;
      }

      body.light-mode {
        background: #f0f2f5;
      }

      /* Notifications Container - Full Width */
      .notifications-container {
        width: 100%;
        max-width: none;
        margin: 0;
        background: white;
        min-height: calc(100vh - 72px);
        transition: background-color 0.3s ease;
      }

      body.dark-mode .notifications-container {
        background: #16213e;
      }

      body.light-mode .notifications-container {
        background: white;
      }

      /* Header - Matches Settings Page */
      .notifications-header {
        background: white;
        padding: 32px 40px;
        border-bottom: 1px solid #e0e0e0;
        position: relative;
        overflow: hidden;
      }

      body.light-mode .notifications-header {
        background: white;
      }

      body.dark-mode .notifications-header {
        background: #0f3460;
        border-bottom-color: #2a4a7a;
      }

      .notifications-header h1 {
        font-size: 34px;
        font-weight: 700;
        font-family: 'Poppins', sans-serif;
        color: #000;
        margin-bottom: 0;
        letter-spacing: -0.5px;
      }

      body.light-mode .notifications-header h1 {
        color: #000;
      }

      body.dark-mode .notifications-header h1 {
        color: #fff;
      }

      .notifications-content {
        padding: 32px 40px;
      }

      .section-title {
        font-size: 20px;
        font-weight: 600;
        font-family: 'Poppins', sans-serif;
        color: #000;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      body.dark-mode .section-title {
        color: #e8e8e8;
      }

      .section-title .icon {
        width: 6px;
        height: 24px;
        background: #667eea;
        border-radius: 3px;
      }

      /* Notification List */
      .notification-list {
        background: #f8f9fa;
        border-radius: 16px;
        overflow: hidden;
        min-height: 400px;
        border: 1px solid #e0e0e0;
      }

      body.dark-mode .notification-list {
        background: #1e3a5f;
        border-color: #2a4a7a;
      }

      .notification-item {
        padding: 20px 24px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        align-items: flex-start;
        gap: 16px;
        transition: all 0.3s ease;
      }

      body.dark-mode .notification-item {
        border-bottom-color: #2a4a7a;
      }

      .notification-item:hover {
        background: rgba(102, 126, 234, 0.05);
      }

      body.dark-mode .notification-item:hover {
        background: rgba(74, 144, 226, 0.1);
      }

      .notification-item.unread {
        background: rgba(102, 126, 234, 0.08);
        border-left: 3px solid #667eea;
      }

      body.dark-mode .notification-item.unread {
        background: rgba(74, 144, 226, 0.15);
        border-left-color: #4a90e2;
      }

      .notification-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        flex-shrink: 0;
      }

      .notification-icon.warning {
        background: rgba(255, 193, 7, 0.15);
      }

      .notification-icon.danger {
        background: rgba(220, 53, 69, 0.15);
      }

      .notification-icon.info {
        background: rgba(102, 126, 234, 0.15);
      }

      .notification-content {
        flex: 1;
      }

      .notification-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #2c3e50;
      }

      body.dark-mode .notification-title {
        color: #e8e8e8;
      }

      .notification-message {
        font-size: 13px;
        color: #7f8c8d;
        margin-bottom: 6px;
        line-height: 1.5;
      }

      body.dark-mode .notification-message {
        color: #a8d0e6;
      }

      .notification-time {
        font-size: 11px;
        color: #95a5a6;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      body.dark-mode .notification-time {
        color: #7a8faa;
      }

      .notification-time::before {
        content: '🕐';
        font-size: 10px;
      }

      .mark-read-btn {
        background: #667eea;
        border: none;
        color: white;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 20px;
        transition: all 0.3s ease;
      }

      .mark-read-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .empty-state {
        text-align: center;
        padding: 60px 24px;
        color: #95a5a6;
      }

      body.dark-mode .empty-state {
        color: #7a8faa;
      }

      .empty-state-icon {
        font-size: 64px;
        margin-bottom: 16px;
        opacity: 0.7;
      }

      .empty-state-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #2c3e50;
      }

      body.dark-mode .empty-state-title {
        color: #e8e8e8;
      }

      /* Button Group */
      .button-group {
        display: flex;
        gap: 16px;
        margin-top: 24px;
      }

      .btn {
        flex: 1;
        padding: 14px;
        font-size: 14px;
        font-weight: 600;
        font-family: 'Poppins', sans-serif;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-secondary {
        background: #667eea;
        color: white;
      }

      body.dark-mode .btn-secondary {
        background: #4a90e2;
      }

      .btn-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      /* Toast Message */
      .toast-msg {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(10px);
        color: white;
        padding: 12px 24px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 500;
        z-index: 1000;
        white-space: nowrap;
      }

      .toast-msg.error {
        background: rgba(220, 53, 69, 0.9);
      }

      body.dark-mode .toast-msg {
        background: rgba(30, 58, 95, 0.95);
        color: #e8e8e8;
      }

      @media (max-width: 768px) {
        .notifications-header {
          padding: 24px 20px;
        }
        .notifications-header h1 {
          font-size: 28px;
        }
        .notifications-content {
          padding: 24px 20px;
        }
        .notification-item {
          padding: 16px;
          flex-wrap: wrap;
        }
        .mark-read-btn {
          width: 100%;
          margin-top: 8px;
        }
        .button-group {
          flex-direction: column;
        }
        .toast-msg {
          white-space: normal;
          max-width: 90%;
          text-align: center;
        }
      }
    </style>
  </head>
  <body class="light-mode">
    <!-- Navbar will be injected here -->
    <div id="navbar"></div>

    <div class="notifications-container">
      <div class="notifications-header">
        <h1>Notifications</h1>
      </div>

      <div class="notifications-content">
        <div id="toastMsg" class="toast-msg"></div>

        <div class="section-title">
          <div class="icon"></div>
          Notification History
        </div>

        <div id="notificationList" class="notification-list">
          <div class="empty-state">
            <div class="empty-state-icon">🔔</div>
            <div class="empty-state-title">Loading notifications...</div>
          </div>
        </div>

        <div class="button-group">
          <button id="markAllReadBtn" class="btn btn-secondary">Mark All as Read</button>
          <button id="clearAllBtn" class="btn btn-secondary">Clear All</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/userNavbarToggle.js" type="text/javascript"></script>
    <script src="js/notifications.js"></script>
    <script src="js/footer.js"></script>
    <!-- Dark Mode Script -->
    <script src="js/darkMode.js"></script>
  </body>
</html>
