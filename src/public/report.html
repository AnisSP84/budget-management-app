<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expense Report</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />

    <!--CSS-->
    <link rel="stylesheet" href="css/report.css" />
    <link rel="stylesheet" href="css/darkMode.css" />
  </head>

  <body class="light-mode">
    <div class="container my-4">
      <h1 class="my-4">Report</h1>

      <!-- BUTTONS -->
      <div class="btn-group mb-3">
        <button class="btn btn-primary" onclick="generateReport('daily')">Daily</button>
        <button class="btn btn-primary" onclick="generateReport('weekly')">Weekly</button>
        <button class="btn btn-primary" onclick="generateReport('monthly')">Monthly</button>
        <button class="btn btn-primary" onclick="generateReport('yearly')">Yearly</button>

        <button id="downloadBtn" class="btn btn-success" onclick="downloadCSV()">
          Download CSV
        </button>
      </div>

      <!-- SUMMARY TABLE -->
      <h2>Summary Report</h2>

      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Period</th>
            <th>Total Spending</th>
          </tr>
        </thead>

        <tbody id="reportBody"></tbody>
      </table>

      <!-- NO DATA MESSAGE -->
      <p id="noDataMessage" class="text-center text-muted" style="display: none">
        No data available.
      </p>

      <!--Chart Selection-->
      <div class="chart-buttons">
        <label class="form-label">
          <strong> Select Chart </strong>
        </label>

        <select
          id="chartType"
          class="form-select w-auto"
          style="width: 200px"
          onchange="changeChart(this.value)"
        >
          <option value="pie">Pie Chart</option>
          <option value="bar">Bar Chart</option>
        </select>
      </div>

      <!--Chart-->
      <div class="chart-container">
        <canvas id="reportChart"></canvas>
      </div>

      <!-- DASHBOARD CARDS -->
      <div class="row g-3 mt-4">
        <div class="col-md-4">
          <div class="card text-center p-3">
            <h5>Total Spending</h5>
            <p id="totalSpending">$0</p>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card text-center p-3">
            <h5>Total Income</h5>
            <p id="totalIncome">$0</p>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card text-center p-3">
            <h5>Net Balance</h5>
            <p id="netBalance">$0</p>
          </div>
        </div>
      </div>

      <!-- TOP 3 CATEGORIES -->
      <div class="card mt-4 p-3">
        <h4>Top 3 Spending Categories</h4>
        <ol id="topCategories"></ol>
      </div>
    </div>

    <!-- CHART JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- IMPORTANT: order matters -->
    <script src="js/queryCmds.js"></script>
    <script src="js/getCurrentURL.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/userNavbarToggle.js"></script>
    <script src="js/getToken.js"></script>

    <!-- MAIN REPORT SCRIPT -->
    <!-- REPORT JS -->
    <script src="js/report.js"></script>
    <!-- Dark Mode Script -->
    <script src="js/darkMode.js"></script>
  </body>
</html>
